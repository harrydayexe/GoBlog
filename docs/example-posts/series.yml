# Series definitions for the example posts.
#
# Enable series by pointing the CLI at this file:
#   goblog serve docs/example-posts --series-file docs/example-posts/series.yml
#
# Posts are named by their filename relative to the posts directory, and the
# order of the list is the reading order: the first entry is part 1.
series:
  - name: "Building a Blog in Go"
    description: "A three-part walk through the pipeline behind a static blog generator."
    posts:
      - building-a-blog-part-1.md
      - building-a-blog-part-2.md
      - building-a-blog-part-3.md
