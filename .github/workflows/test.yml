name: Test

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

jobs:
  test:
    name: Unit tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The library and the CLI are separate Go modules, so `./...` from the
        # repo root does not reach the CLI. Each module is tested in its own job.
        module: ['.', 'cli']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            cli/go.sum

      - name: Run go vet
        run: go -C ${{ matrix.module }} vet ./...

      - name: Run tests
        run: go -C ${{ matrix.module }} test -v ./...

      - name: Run tests with race detector
        run: go -C ${{ matrix.module }} test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: integration/go.sum

      - name: Run go vet
        run: go -C integration vet ./...

      - name: Run integration tests
        run: go -C integration test -race -v -timeout 15m ./...

  build-docker-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: goblog:latest
          platforms: linux/amd64,linux/arm64
